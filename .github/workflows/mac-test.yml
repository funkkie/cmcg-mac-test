name: mac-test-x11
on: workflow_dispatch

jobs:
  test:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show uploaded program files
        run: |
          ls -la app/
          for f in app/*.exe app/*.dll; do [ -f "$f" ] && file "$f"; done

      - name: Install Wine (Game Porting Toolkit build)
        timeout-minutes: 20
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          brew tap gcenx/wine
          brew trust gcenx/wine || true
          brew install --cask gcenx/wine/game-porting-toolkit
          wine64 --version

      - name: Init wine prefix
        timeout-minutes: 6
        run: |
          export WINEPREFIX=$HOME/.wine-test
          export WINEDEBUG=-all
          wine64 wineboot --init

      - name: Run Login.exe under Wine, screenshot the Mac screen
        timeout-minutes: 6
        continue-on-error: true
        run: |
          export WINEPREFIX=$HOME/.wine-test
          export WINEDEBUG=err+all
          cd app
          wine64 Login.exe > "$HOME/login-wine.log" 2>&1 &
          sleep 30
          echo "--- is Login.exe still running? ---"
          ps aux | grep -i -E "Login.exe" | grep -v grep || echo "NOT RUNNING (exited or crashed)"
          screencapture -x /tmp/login-screen.png || true
          ls -la /tmp/login-screen.png || true
          echo "--- last 80 lines of Wine log ---"
          tail -80 "$HOME/login-wine.log" || true
          cp "$HOME/login-wine.log" /tmp/login-wine.log || true

      - name: Upload screenshot and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-test-result
          path: |
            /tmp/login-screen.png
            /tmp/login-wine.log
          if-no-files-found: warn
