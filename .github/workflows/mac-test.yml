name: mac-test-x11
on: workflow_dispatch

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 340
    steps:
      - name: Install XQuartz (X server + X11 dev headers)
        run: brew install --cask xquartz

      - name: Cache MacPorts + deps
        id: cache-macports
        uses: actions/cache@v4
        with:
          path: /opt/local
          key: macports-wine-x11-v1

      - name: Install MacPorts
        if: steps.cache-macports.outputs.cache-hit != 'true'
        run: |
          curl -LO https://github.com/macports/macports-base/releases/download/v2.10.5/MacPorts-2.10.5-14-Sonoma.pkg
          sudo installer -pkg MacPorts-2.10.5-14-Sonoma.pkg -target /

      - name: Install Wine via MacPorts (to pull all build dependencies into /opt/local)
        if: steps.cache-macports.outputs.cache-hit != 'true'
        run: |
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          sudo port -N install wine bison flex pkgconfig
        timeout-minutes: 300

      - name: Ensure build tools present (cache-hit path)
        if: steps.cache-macports.outputs.cache-hit == 'true'
        run: |
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          sudo port -N install bison flex pkgconfig

      - name: Install llvm-mingw toolchain (PE cross-compiler for aarch64 host)
        run: |
          LATEST_URL=$(curl -sL -o /dev/null -w '%{url_effective}' https://github.com/mstorsjo/llvm-mingw/releases/latest)
          TAG=$(basename "$LATEST_URL")
          if [ -z "$TAG" ] || [ "$TAG" = "latest" ]; then
            echo "ERROR: could not resolve latest llvm-mingw tag (got: '$TAG')"
            exit 1
          fi
          echo "Using llvm-mingw tag: $TAG"
          URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${TAG}/llvm-mingw-${TAG}-ucrt-macos-universal.tar.xz"
          echo "Downloading: $URL"
          curl -L -o llvm-mingw.tar.xz "$URL"
          FILESIZE=$(stat -f%z llvm-mingw.tar.xz)
          echo "Downloaded file size: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 1000000 ]; then
            echo "ERROR: downloaded file too small, likely not a real archive:"
            cat llvm-mingw.tar.xz
            exit 1
          fi
          mkdir -p ~/llvm-mingw
          tar xf llvm-mingw.tar.xz -C ~/llvm-mingw --strip-components=1
          echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Locate Wine source tarball already fetched by MacPorts
        id: findsrc
        run: |
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          TARBALL=$(find /opt/local/var/macports/distfiles/wine -type f \( -iname "*.tar.xz" -o -iname "*.tar.gz" -o -iname "*.tar.bz2" \) 2>/dev/null | head -1)
          if [ -z "$TARBALL" ]; then
            TARBALL=$(find /opt/local/var/macports/distfiles -type f -iname "wine-*" 2>/dev/null | head -1)
          fi
          echo "Found: $TARBALL"
          if [ -z "$TARBALL" ]; then
            echo "ERROR: no wine source tarball found"
            exit 1
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Build Wine from source with X11 driver enabled
        env:
          PKG_CONFIG_PATH: /opt/local/lib/pkgconfig
        run: |
          export PATH="$HOME/llvm-mingw/bin:/opt/local/bin:/opt/local/sbin:$PATH"
          mkdir -p ~/wine-src && cd ~/wine-src
          tar xf "${{ steps.findsrc.outputs.tarball }}" --strip-components=1
          ./configure --prefix=$HOME/wine-x11 \
            --with-x \
            --x-includes=/opt/X11/include \
            --x-libraries=/opt/X11/lib \
            2>&1 | tee ~/configure.log
          make -j"$(sysctl -n hw.ncpu)" 2>&1 | tee ~/make.log
          make install 2>&1 | tee ~/make-install.log
        timeout-minutes: 300

      - name: Create local self-signed code-signing identity
        id: cert
        timeout-minutes: 3
        run: |
          KEYCHAIN="$HOME/sign.keychain-db"
          PASSWORD="actions"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"

          cat > "$HOME/csr.cnf" << 'CNF_EOF'
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no
          [dn]
          CN = WineLocalSigning
          [ext]
          basicConstraints=critical,CA:true
          keyUsage=critical,keyCertSign,digitalSignature
          extendedKeyUsage=critical,codeSigning
          CNF_EOF

          openssl req -x509 -newkey rsa:2048 -keyout "$HOME/signkey.pem" -out "$HOME/signcert.pem" -days 3650 -nodes -config "$HOME/csr.cnf"
          openssl pkcs12 -export -out "$HOME/signcert.p12" -inkey "$HOME/signkey.pem" -in "$HOME/signcert.pem" -passout "pass:$PASSWORD" -legacy 2>/dev/null || \
            openssl pkcs12 -export -out "$HOME/signcert.p12" -inkey "$HOME/signkey.pem" -in "$HOME/signcert.pem" -passout "pass:$PASSWORD"

          security import "$HOME/signcert.p12" -k "$KEYCHAIN" -P "$PASSWORD" -T /usr/bin/codesign -T /usr/bin/security

          # Mark the cert as trusted for code signing, scoped to THIS keychain only (no -d flag,
          # so this writes a per-keychain trust record in the USER trust domain, not the admin/
          # default domain). The -d variant is what popped an un-answerable GUI auth prompt and
          # hung runs #19 and #21; this unflagged form does not touch system trust settings and
          # should not require authorization. Guarded by the step's 3-minute timeout regardless,
          # in case this assumption is wrong on this runner.
          security add-trusted-cert -r trustRoot -p codeSign -k "$KEYCHAIN" "$HOME/signcert.pem" || \
            echo "WARNING: add-trusted-cert (user domain) failed or was not permitted; continuing anyway"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN"

          EXISTING=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING

          echo "=== find-identity (codesigning) ==="
          security find-identity -v -p codesigning "$KEYCHAIN"

          IDENTITY_HASH=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "WineLocalSigning" | head -1 | sed -E 's/^[[:space:]]*[0-9]+\)[[:space:]]+([A-F0-9]+)[[:space:]].*/\1/')
          if [ -z "$IDENTITY_HASH" ]; then
            echo "find-identity -p codesigning still found nothing; trying find-identity -v (no policy filter) instead."
            IDENTITY_HASH=$(security find-identity -v "$KEYCHAIN" | grep "WineLocalSigning" | head -1 | sed -E 's/^[[:space:]]*[0-9]+\)[[:space:]]+([A-F0-9]+)[[:space:]].*/\1/')
          fi
          if [ -z "$IDENTITY_HASH" ]; then
            echo "ERROR: could not find WineLocalSigning identity hash via find-identity"
            echo "Falling back to signing directly with the certificate's SHA-1 hash instead."
            IDENTITY_HASH=$(openssl x509 -in "$HOME/signcert.pem" -noout -fingerprint -sha1 | sed 's/.*=//; s/://g')
            echo "Fallback SHA-1: $IDENTITY_HASH"
          fi
          echo "Using identity hash: $IDENTITY_HASH"
          echo "identity=$IDENTITY_HASH" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

      - name: Code-sign Wine binaries (self-signed identity + entitlements on main executables only, ad-hoc on libraries)
        timeout-minutes: 5
        run: |
          cat > "$HOME/wine-entitlements.plist" << 'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key><true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
              <key>com.apple.security.cs.disable-executable-page-protection</key><true/>
              <key>com.apple.security.cs.disable-library-validation</key><true/>
              <key>com.apple.security.cs.allow-dyld-environment-variables</key><true/>
          </dict>
          </plist>
          PLIST_EOF
          IDENTITY="${{ steps.cert.outputs.identity }}"
          KEYCHAIN="${{ steps.cert.outputs.keychain }}"
          echo "Signing with identity: $IDENTITY (keychain: $KEYCHAIN)"
          EXECCOUNT=0
          LIBCOUNT=0
          while IFS= read -r -d '' f; do
            TYPE=$(file -b "$f" 2>/dev/null)
            if echo "$TYPE" | grep -q "executable"; then
              codesign --options runtime --entitlements "$HOME/wine-entitlements.plist" --force -s "$IDENTITY" --keychain "$KEYCHAIN" "$f" 2>&1 | grep -v "replacing existing signature" || true
              EXECCOUNT=$((EXECCOUNT+1))
            else
              codesign --options runtime --force -s "$IDENTITY" --keychain "$KEYCHAIN" "$f" 2>&1 | grep -v "replacing existing signature" || true
              LIBCOUNT=$((LIBCOUNT+1))
            fi
          done < <(find "$HOME/wine-x11" -type f \( -perm -111 -o -name "*.dylib" -o -name "*.so" \) -print0 2>/dev/null)
          echo "Signed $EXECCOUNT main executables WITH entitlements (identity: $IDENTITY)."
          echo "Signed $LIBCOUNT libraries/builtin-dlls WITHOUT entitlements."
          echo "Verifying wine signature (need a real cert chain now, not adhoc):"
          codesign -dvvv "$HOME/wine-x11/bin/wine" 2>&1 || true

      - name: Upload build logs (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-build-logs
          path: |
            ~/configure.log
            ~/make.log
            ~/make-install.log

      - name: Start virtual display (Xvfb)
        run: |
          export PATH="/opt/X11/bin:$PATH"
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 5

      - name: Init wine prefix (force X11 driver, disable mac driver)
        timeout-minutes: 3
        env:
          DISPLAY: ":99"
          WINE_NO_MAC_DRIVER: "1"
        run: |
          export PATH="$HOME/wine-x11/bin:$PATH"
          export WINEPREFIX=$HOME/.wine-test
          unset WINEARCH
          set +e
          wineboot --init
          STATUS=$?
          set -e
          echo "wineboot exit status: $STATUS"
          if [ "$STATUS" -ne 0 ]; then
            echo "=== Recent unified system log mentioning wine / amfid / constraint violation / certificate chain (last 3 min) ==="
            log show --last 3m --info --debug --predicate 'eventMessage contains[c] "wine" or process == "amfid" or eventMessage contains[c] "amfid" or eventMessage contains[c] "constraint violation" or eventMessage contains[c] "certificate chain"' 2>&1 | tail -300 || echo "log show produced nothing or failed"
            exit $STATUS
          fi
          sleep 10

      - name: Launch Notepad under Wine (GUI smoke test)
        timeout-minutes: 2
        env:
          DISPLAY: ":99"
          WINE_NO_MAC_DRIVER: "1"
        run: |
          export PATH="$HOME/wine-x11/bin:$PATH"
          export WINEPREFIX=$HOME/.wine-test
          wine notepad &
          sleep 15

      - name: Capture screenshot of virtual display
        timeout-minutes: 3
        run: |
          export PATH="/opt/X11/bin:$PATH"
          brew install imagemagick
          xwd -root -display :99 -out /tmp/screen.xwd
          convert /tmp/screen.xwd /tmp/screen.png

      - name: Upload screenshot as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-x11-test-screenshot
          path: /tmp/screen.png

      - name: Setup upterm session (backup for manual debugging)
        if: always()
        uses: owenthereal/action-upterm@v1
        with:
          wait-timeout-minutes: 5
