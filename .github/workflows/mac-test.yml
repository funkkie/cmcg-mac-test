name: mac-test-x11
on: workflow_dispatch

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 340
    steps:
      - name: Install XQuartz (X server + X11 dev headers)
        run: brew install --cask xquartz

      - name: Cache MacPorts + deps
        id: cache-macports
        uses: actions/cache/restore@v4
        with:
          path: /opt/local
          key: macports-wine-x11-v2

      - name: Install MacPorts
        if: steps.cache-macports.outputs.cache-hit != 'true'
        run: |
          curl -LO https://github.com/macports/macports-base/releases/download/v2.10.5/MacPorts-2.10.5-14-Sonoma.pkg
          sudo installer -pkg MacPorts-2.10.5-14-Sonoma.pkg -target /

      - name: Install Wine via MacPorts (to pull all build dependencies into /opt/local)
        if: steps.cache-macports.outputs.cache-hit != 'true'
        run: |
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          sudo port -N install wine bison flex pkgconfig
        timeout-minutes: 300

      - name: Save MacPorts cache early (so later failures do not lose it)
        if: steps.cache-macports.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/local
          key: macports-wine-x11-v2

      - name: Ensure build tools present (cache-hit path)
        if: steps.cache-macports.outputs.cache-hit == 'true'
        run: |
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          sudo port -N install bison flex pkgconfig

      - name: Install llvm-mingw toolchain (PE cross-compiler for aarch64 host)
        run: |
          LATEST_URL=$(curl -sL -o /dev/null -w '%{url_effective}' https://github.com/mstorsjo/llvm-mingw/releases/latest)
          TAG=$(basename "$LATEST_URL")
          if [ -z "$TAG" ] || [ "$TAG" = "latest" ]; then
            echo "ERROR: could not resolve latest llvm-mingw tag (got: '$TAG')"
            exit 1
          fi
          echo "Using llvm-mingw tag: $TAG"
          URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${TAG}/llvm-mingw-${TAG}-ucrt-macos-universal.tar.xz"
          echo "Downloading: $URL"
          curl -L -o llvm-mingw.tar.xz "$URL"
          FILESIZE=$(stat -f%z llvm-mingw.tar.xz)
          echo "Downloaded file size: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 1000000 ]; then
            echo "ERROR: downloaded file too small, likely not a real archive:"
            cat llvm-mingw.tar.xz
            exit 1
          fi
          mkdir -p ~/llvm-mingw
          tar xf llvm-mingw.tar.xz -C ~/llvm-mingw --strip-components=1
          echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Locate Wine source tarball already fetched by MacPorts
        id: findsrc
        run: |
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          TARBALL=$(find /opt/local/var/macports/distfiles/wine -type f \( -iname "*.tar.xz" -o -iname "*.tar.gz" -o -iname "*.tar.bz2" \) 2>/dev/null | head -1)
          if [ -z "$TARBALL" ]; then
            TARBALL=$(find /opt/local/var/macports/distfiles -type f -iname "wine-*" 2>/dev/null | head -1)
          fi
          echo "Found: $TARBALL"
          if [ -z "$TARBALL" ]; then
            echo "ERROR: no wine source tarball found"
            exit 1
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Build Wine from source with X11 driver enabled
        env:
          PKG_CONFIG_PATH: /opt/local/lib/pkgconfig
        run: |
          export PATH="$HOME/llvm-mingw/bin:/opt/local/bin:/opt/local/sbin:$PATH"
          mkdir -p ~/wine-src && cd ~/wine-src
          tar xf "${{ steps.findsrc.outputs.tarball }}" --strip-components=1
          ./configure --prefix=$HOME/wine-x11 \
            --with-x \
            --x-includes=/opt/X11/include \
            --x-libraries=/opt/X11/lib \
            2>&1 | tee ~/configure.log
          make -j"$(sysctl -n hw.ncpu)" 2>&1 | tee ~/make.log
          make install 2>&1 | tee ~/make-install.log
        timeout-minutes: 300

      - name: Start virtual display (Xvfb)
        run: |
          export PATH="/opt/X11/bin:$PATH"
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 5

      - name: Try several code-signing strategies, keep the first where wineboot works
        timeout-minutes: 20
        env:
          DISPLAY: ":99"
          WINE_NO_MAC_DRIVER: "1"
        run: |
          cat > "$HOME/ents-full.plist" << 'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key><true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
              <key>com.apple.security.cs.disable-executable-page-protection</key><true/>
              <key>com.apple.security.cs.disable-library-validation</key><true/>
              <key>com.apple.security.cs.allow-dyld-environment-variables</key><true/>
          </dict>
          </plist>
          PLIST_EOF

          sign_all() {
            MODE="$1"
            find "$HOME/wine-x11" -type f \( -perm -111 -o -name "*.dylib" -o -name "*.so" \) -print0 2>/dev/null | while IFS= read -r -d '' f; do
              TYPE=$(file -b "$f" 2>/dev/null)
              ISEXEC=0
              if echo "$TYPE" | grep -q "executable"; then ISEXEC=1; fi
              case "$MODE" in
                plain)
                  codesign --force -s - "$f" >/dev/null 2>&1 || true ;;
                ents_noruntime)
                  if [ "$ISEXEC" = "1" ]; then
                    codesign --force --entitlements "$HOME/ents-full.plist" -s - "$f" >/dev/null 2>&1 || true
                  else
                    codesign --force -s - "$f" >/dev/null 2>&1 || true
                  fi ;;
                ents_runtime)
                  if [ "$ISEXEC" = "1" ]; then
                    codesign --force --options runtime --entitlements "$HOME/ents-full.plist" -s - "$f" >/dev/null 2>&1 || true
                  else
                    codesign --force -s - "$f" >/dev/null 2>&1 || true
                  fi ;;
              esac
            done
          }

          try_wine() {
            export PATH="$HOME/wine-x11/bin:$PATH"
            export WINEPREFIX="$HOME/.wine-try"
            rm -rf "$WINEPREFIX"
            unset WINEARCH
            wineboot --init > "$HOME/wineboot-try.log" 2>&1 &
            WPID=$!
            ( sleep 150; kill -9 $WPID 2>/dev/null ) &
            WD=$!
            wait $WPID
            RC=$?
            kill $WD 2>/dev/null
            echo "wineboot exit code: $RC"
            tail -20 "$HOME/wineboot-try.log"
            return $RC
          }

          CHOSEN=""
          for MODE in plain ents_noruntime ents_runtime; do
            echo "=================== STRATEGY: $MODE ==================="
            sign_all "$MODE"
            codesign -dvv "$HOME/wine-x11/bin/wine" 2>&1 | head -12 || true
            if try_wine; then
              echo "SUCCESS with strategy: $MODE"
              CHOSEN="$MODE"
              break
            fi
            echo "--- strategy $MODE failed; kernel/amfid log: ---"
            log show --last 2m --info --debug --predicate 'process == "amfid" or process == "taskgated-helper" or eventMessage contains[c] "constraint violation" or eventMessage contains[c] "wine"' 2>&1 | grep -iE "wine|violation|not valid|disallow|AMFI" | tail -25 || true
          done
          if [ -z "$CHOSEN" ]; then
            echo "ERROR: no signing strategy let wineboot run"
            exit 1
          fi
          echo "Chosen strategy: $CHOSEN"

      - name: Upload build logs (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-build-logs
          path: |
            ~/configure.log
            ~/make.log
            ~/make-install.log
            ~/wineboot-try.log

      - name: Init wine prefix (force X11 driver, disable mac driver)
        timeout-minutes: 3
        env:
          DISPLAY: ":99"
          WINE_NO_MAC_DRIVER: "1"
        run: |
          export PATH="$HOME/wine-x11/bin:$PATH"
          export WINEPREFIX=$HOME/.wine-test
          unset WINEARCH
          wineboot --init
          sleep 10

      - name: Launch Notepad under Wine (GUI smoke test)
        timeout-minutes: 2
        env:
          DISPLAY: ":99"
          WINE_NO_MAC_DRIVER: "1"
        run: |
          export PATH="$HOME/wine-x11/bin:$PATH"
          export WINEPREFIX=$HOME/.wine-test
          wine notepad &
          sleep 15

      - name: Capture screenshot of virtual display
        timeout-minutes: 3
        run: |
          export PATH="/opt/X11/bin:$PATH"
          brew install imagemagick
          xwd -root -display :99 -out /tmp/screen.xwd
          convert /tmp/screen.xwd /tmp/screen.png

      - name: Upload screenshot as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-x11-test-screenshot
          path: /tmp/screen.png

      - name: Setup upterm session (backup for manual debugging)
        if: always()
        uses: owenthereal/action-upterm@v1
        with:
          wait-timeout-minutes: 5
