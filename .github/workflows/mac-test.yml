name: mac-test-x11
on: workflow_dispatch

jobs:
  test:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Machine info
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string
          csrutil status || true

      - name: Install Wine (prebuilt x86_64 Mac build from Gcenx tap)
        timeout-minutes: 20
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          brew tap gcenx/wine
          brew trust gcenx/wine || true
          TAPDIR=$(brew --repository gcenx/wine)
          echo "=== files in tap ==="
          find "$TAPDIR" -name "*.rb" -not -path "*/.git/*" | head -40
          echo "=== brew search ==="
          brew search --casks wine || true
          CASKFILE=$(find "$TAPDIR" -name "*.rb" -not -path "*/.git/*" | grep -i "stable" | head -1)
          if [ -z "$CASKFILE" ]; then CASKFILE=$(find "$TAPDIR" -name "*.rb" -not -path "*/.git/*" | grep -i wine | head -1); fi
          echo "chosen cask file: $CASKFILE"
          CASKNAME=$(basename "$CASKFILE" .rb)
          echo "installing cask: gcenx/wine/$CASKNAME"
          brew install --cask "gcenx/wine/$CASKNAME"
          ls /Applications | grep -i wine || true
          sudo xattr -dr com.apple.quarantine /Applications/Wine*.app || true

      - name: Locate wine binary and check version
        id: findwine
        timeout-minutes: 3
        run: |
          WINE=$(ls -d /Applications/Wine*.app/Contents/Resources/wine/bin/wine 2>/dev/null | head -1)
          if [ -z "$WINE" ]; then WINE=$(which wine64 || which wine || true); fi
          echo "wine binary: $WINE"
          file "$WINE"
          "$WINE" --version
          echo "wine=$WINE" >> "$GITHUB_OUTPUT"

      - name: Init wine prefix
        timeout-minutes: 6
        continue-on-error: true
        run: |
          export WINEPREFIX=$HOME/.wine-test
          export WINEDEBUG=-all
          "${{ steps.findwine.outputs.wine }}" wineboot --init > "$HOME/wineboot.log" 2>&1 &
          WPID=$!
          ( sleep 240; kill -9 $WPID 2>/dev/null ) &
          wait $WPID
          echo "wineboot exit code: $?"
          tail -30 "$HOME/wineboot.log"

      - name: Launch Notepad and take real screenshot of the Mac screen
        timeout-minutes: 4
        continue-on-error: true
        run: |
          export WINEPREFIX=$HOME/.wine-test
          export WINEDEBUG=-all
          "${{ steps.findwine.outputs.wine }}" notepad > "$HOME/notepad.log" 2>&1 &
          sleep 25
          screencapture -x /tmp/screen.png || true
          ls -la /tmp/screen.png || true
          ps aux | grep -i -E "wine|notepad" | grep -v grep | head -10 || true
          tail -20 "$HOME/notepad.log" || true

      - name: Upload screenshot as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-x11-test-screenshot
          path: /tmp/screen.png
          if-no-files-found: warn

      - name: Setup upterm session (backup for manual debugging)
        if: always()
        uses: owenthereal/action-upterm@v1
        with:
          wait-timeout-minutes: 3
